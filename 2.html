<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>/7</title>
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/bx4VCsh.jpeg">
    <style>
        body {
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
            background: #111;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -60px;
            background-image: url('https://i.imgur.com/bx4VCsh.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(40px) saturate(1.2) brightness(0.7);
            transform: scale(1.1);
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                rgba(17, 17, 17, 0.35) 0%,
                rgba(17, 17, 17, 0.6) 70%,
                rgba(17, 17, 17, 0.8) 100%
            );
            z-index: -1;
            pointer-events: none;
        }

        /* === ЗВЕЗДА-ЛАЙК ВНИЗУ СЛЕВА === */
        .like-wrapper {
            position: fixed;
            bottom: 40px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }

        .like-wrapper .btn-wrap {
            padding: 4px;
        }

        #star-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            background-color: #2a1e14;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transform-origin: center center;
            position: relative;
            z-index: 2;
            transition: background-color 0.3s ease, transform 0.4s ease, box-shadow 0.4s ease;
            box-shadow:
                0 0 8px rgba(244, 162, 113, 0.6),
                0 0 16px rgba(244, 162, 113, 0.4),
                0 0 32px rgba(192, 116, 77, 0.25),
                0 0 56px rgba(249, 112, 93, 0.12);
        }

        .btn-wrap:hover #star-btn {
            background-color: #3a2a1c;
            transform: scale(1.12);
            box-shadow:
                0 0 12px rgba(248, 205, 183, 0.9),
                0 0 24px rgba(244, 162, 113, 0.7),
                0 0 48px rgba(192, 116, 77, 0.5),
                0 0 80px rgba(249, 112, 93, 0.3);
        }

        #star-btn svg {
            width: 18px;
            height: 18px;
            fill: #6b4a30; /* тёмная звезда по умолчанию */
            stroke: #6b4a30;
            stroke-width: 1.8;
            stroke-linejoin: round;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        #star-btn.liked svg {
            fill: #f8cdb7; /* светлая звезда, если лайк поставлен */
            stroke: #f8cdb7;
        }

        #like-count {
            font-size: 14px;
            font-weight: 600;
            color: #6b4a30; /* тёмный цвет цифры по умолчанию */
            min-width: 14px;
            text-align: left;
            transition: color 0.3s ease;
        }

        #like-count.liked {
            color: #f8cdb7; /* светлый цвет цифры, если лайк поставлен */
        }

        /* === КНОПКИ ВНИЗУ === */
        .buttons {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 50;
        }

        .btn-wrap {
            position: relative;
            display: inline-block;
            padding: 4px;
        }

        .btn-orbs {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .btn-orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            text-decoration: none;
            border-radius: 7px;
            transform-origin: center center;
            position: relative;
            z-index: 2;
            transition: background-color 0.3s ease, transform 0.4s ease, box-shadow 0.4s ease, color 0.3s ease;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            display: block;
        }

        .telegram-btn {
            background-color: #0088cc;
            color: #ffffff;
            box-shadow:
                0 0 8px rgba(0, 153, 230, 0.6),
                0 0 16px rgba(0, 153, 230, 0.4),
                0 0 32px rgba(0, 153, 230, 0.25),
                0 0 56px rgba(0, 153, 230, 0.12);
        }

        .btn-wrap:hover .telegram-btn {
            background-color: #0099e6;
            transform: scale(1.12);
            box-shadow:
                0 0 12px rgba(0, 153, 230, 0.9),
                0 0 24px rgba(0, 153, 230, 0.7),
                0 0 48px rgba(0, 153, 230, 0.5),
                0 0 80px rgba(0, 153, 230, 0.3);
        }

        .steam-btn {
            background-color: #1b2838;
            color: #c7d5e0;
            box-shadow:
                0 0 8px rgba(27, 40, 56, 0.95),
                0 0 16px rgba(27, 40, 56, 0.75),
                0 0 32px rgba(27, 40, 56, 0.5),
                0 0 56px rgba(27, 40, 56, 0.25);
        }

        .btn-wrap:hover .steam-btn {
            background-color: #2a475e;
            color: #ffffff;
            transform: scale(1.12);
            box-shadow:
                0 0 12px rgba(42, 71, 94, 1),
                0 0 24px rgba(42, 71, 94, 0.8),
                0 0 48px rgba(42, 71, 94, 0.55),
                0 0 80px rgba(42, 71, 94, 0.3);
        }

        .discord-btn {
            background-color: #5865F2;
            color: #ffffff;
            box-shadow:
                0 0 8px rgba(88, 101, 242, 0.7),
                0 0 16px rgba(88, 101, 242, 0.5),
                0 0 32px rgba(88, 101, 242, 0.3),
                0 0 56px rgba(88, 101, 242, 0.15);
        }

        .btn-wrap:hover .discord-btn {
            background-color: #4752c4;
            transform: scale(1.12);
            box-shadow:
                0 0 12px rgba(88, 101, 242, 1),
                0 0 24px rgba(88, 101, 242, 0.8),
                0 0 48px rgba(88, 101, 242, 0.55),
                0 0 80px rgba(88, 101, 242, 0.35);
        }

        .soundcloud-btn {
            background-color: #ff5500;
            color: #ffffff;
            box-shadow:
                0 0 8px rgba(255, 85, 0, 0.7),
                0 0 16px rgba(255, 85, 0, 0.5),
                0 0 32px rgba(255, 85, 0, 0.3),
                0 0 56px rgba(255, 85, 0, 0.15);
        }

        .btn-wrap:hover .soundcloud-btn {
            background-color: #ff7733;
            transform: scale(1.12);
            box-shadow:
                0 0 12px rgba(255, 85, 0, 1),
                0 0 24px rgba(255, 85, 0, 0.8),
                0 0 48px rgba(255, 85, 0, 0.55),
                0 0 80px rgba(255, 85, 0, 0.35);
        }

        .main-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .cover-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            transition: transform 0.4s ease;
            transform-origin: center center;
        }

        .cover-container:hover {
            transform: scale(1.03);
        }

        .cover {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            z-index: 2;
            box-shadow:
                0 4px 25px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(192, 116, 77, 0.35),
                0 0 60px rgba(244, 162, 113, 0.2);
            transition: box-shadow 0.8s ease;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover.playing {
            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(244, 162, 113, 0.7),
                0 0 90px rgba(192, 116, 77, 0.5),
                0 0 140px rgba(249, 112, 93, 0.3);
        }

        .orbs {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: rgba(244, 162, 113, 0.45);
            box-shadow:
                0 0 8px 2px rgba(248, 205, 183, 0.6),
                0 0 20px 6px rgba(244, 162, 113, 0.4),
                0 0 40px 12px rgba(192, 116, 77, 0.2);
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .track-title {
            margin-top: 30px;
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            opacity: 0.9;
            text-shadow:
                0 0 3px rgba(255, 255, 255, 0.8),
                0 0 6px rgba(255, 255, 255, 0.6),
                0 0 12px rgba(255, 255, 255, 0.4);
            transition: text-shadow 0.6s ease, transform 0.4s ease, opacity 0.6s ease;
            transform-origin: center center;
        }

        .track-title.playing {
            opacity: 1;
            text-shadow:
                0 0 4px #ffffff,
                0 0 8px #ffffff,
                0 0 16px #ffffff,
                0 0 28px rgba(248, 205, 183, 0.85),
                0 0 50px rgba(244, 162, 113, 0.55),
                0 0 80px rgba(249, 112, 93, 0.3);
        }

        .track-artist {
            margin-top: 10px;
            font-size: 12px;
            color: #ffffff;
            opacity: 0.55;
            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.5);
            transition: text-shadow 0.6s ease, transform 0.4s ease, opacity 0.6s ease;
            transform-origin: center center;
        }

        .track-artist.playing {
            opacity: 0.8;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.8),
                0 0 12px rgba(244, 162, 113, 0.6),
                0 0 24px rgba(192, 116, 77, 0.35);
        }

        .main-block.hovered .track-title,
        .main-block.hovered .track-artist {
            transform: scale(1.08);
        }

        .volume-wrapper {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(35, 25, 17, 0.45);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(244, 162, 113, 0.15);
            transform-origin: top right;
            opacity: 0.4;
            transition: opacity 0.4s ease, box-shadow 0.5s ease, transform 0.4s ease, border-color 0.4s ease;
            z-index: 100;
            box-shadow:
                0 0 8px rgba(244, 162, 113, 0.25),
                0 0 16px rgba(192, 116, 77, 0.15);
        }

        .volume-wrapper:hover {
            opacity: 1;
            transform: scale(1.08);
            border-color: rgba(244, 162, 113, 0.4);
            box-shadow:
                0 0 12px rgba(248, 205, 183, 0.9),
                0 0 24px rgba(244, 162, 113, 0.6),
                0 0 48px rgba(192, 116, 77, 0.4),
                0 0 80px rgba(249, 112, 93, 0.2);
        }

        #volume-slider {
            width: 70px;
            height: 3px;
            cursor: pointer;
            accent-color: #f4a271;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        #volume-slider::-webkit-slider-runnable-track {
            height: 3px;
            background: rgba(244, 162, 113, 0.3);
            border-radius: 3px;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f4a271;
            margin-top: -3.5px;
            box-shadow: 0 0 6px rgba(248, 205, 183, 0.9);
        }

        #volume-slider::-moz-range-track {
            height: 3px;
            background: rgba(244, 162, 113, 0.3);
            border-radius: 3px;
        }

        #volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            background: #f4a271;
            box-shadow: 0 0 6px rgba(248, 205, 183, 0.9);
        }

        #volume-label {
            font-size: 11px;
            user-select: none;
            color: #f4a271;
        }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        (function() {
            var audio = document.getElementById('my-audio');
            var cover = document.getElementById('cover');
            var coverContainer = document.getElementById('coverContainer');
            var mainBlock = document.getElementById('mainBlock');
            var orbsContainer = document.getElementById('orbs');
            var volumeSlider = document.getElementById('volume-slider');
            var volumeLabel = document.getElementById('volume-label');
            var trackTitle = document.getElementById('trackTitle');
            var trackArtist = document.getElementById('trackArtist');
            var isPlaying = false;
            var orbInterval = null;

            function setupButtonOrbs() {
                var wraps = document.querySelectorAll('.btn-wrap');
                wraps.forEach(function(wrap) {
                    var orbsBox = wrap.querySelector('.btn-orbs');
                    var btn = wrap.querySelector('a') || wrap.querySelector('button');
                    if (!orbsBox || !btn) return;
                    var color = wrap.getAttribute('data-orb-color');
                    var coreColor = wrap.getAttribute('data-orb-core') || color;
                    var interval = null;

                    wrap.addEventListener('mouseenter', function() {
                        if (interval) return;
                        interval = setInterval(function() {
                            createButtonOrb(orbsBox, btn, color, coreColor);
                        }, 250);
                        createButtonOrb(orbsBox, btn, color, coreColor);
                        createButtonOrb(orbsBox, btn, color, coreColor);
                    });

                    wrap.addEventListener('mouseleave', function() {
                        if (interval) {
                            clearInterval(interval);
                            interval = null;
                        }
                    });
                });
            }

            function createButtonOrb(container, btn, color, coreColor) {
                var orb = document.createElement('div');
                orb.className = 'btn-orb';

                var size = 2 + Math.random() * 3;
                orb.style.width = size + 'px';
                orb.style.height = size + 'px';

                orb.style.background = 'radial-gradient(circle, rgba(' + coreColor + ', 0.95) 0%, rgba(' + color + ', 0.6) 60%, rgba(' + color + ', 0) 100%)';
                orb.style.boxShadow =
                    '0 0 5px 1px rgba(' + coreColor + ', 0.8),' +
                    '0 0 12px 3px rgba(' + color + ', 0.5),' +
                    '0 0 22px 6px rgba(' + color + ', 0.2)';

                var w = btn.offsetWidth;
                var h = btn.offsetHeight;

                var side = Math.floor(Math.random() * 4);
                var x, y;
                var outside = 2;

                if (side === 0) {
                    x = Math.random() * w;
                    y = -outside;
                } else if (side === 1) {
                    x = w + outside;
                    y = Math.random() * h;
                } else if (side === 2) {
                    x = Math.random() * w;
                    y = h + outside;
                } else {
                    x = -outside;
                    y = Math.random() * h;
                }

                orb.style.left = x + 'px';
                orb.style.top = y + 'px';

                container.appendChild(orb);

                var centerX = w / 2;
                var centerY = h / 2;
                var dirX = x - centerX;
                var dirY = y - centerY;
                var len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
                dirX /= len;
                dirY /= len;

                var distance = 8 + Math.random() * 10;
                var dx = dirX * distance;
                var dy = dirY * distance;

                var duration = 3000 + Math.random() * 1500;

                var anim = orb.animate([
                    { transform: 'translate(-50%, -50%) scale(0.3)', opacity: 0 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.95, offset: 0.2 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.7, offset: 0.6 },
                    { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.5)', opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'forwards'
                });

                anim.onfinish = function() {
                    if (orb.parentNode) orb.parentNode.removeChild(orb);
                };
            }

            setupButtonOrbs();

            coverContainer.addEventListener('mouseenter', function() {
                mainBlock.classList.add('hovered');
            });
            coverContainer.addEventListener('mouseleave', function() {
                mainBlock.classList.remove('hovered');
            });

            function createOrb() {
                if (!isPlaying) return;
                var orb = document.createElement('div');
                orb.className = 'orb';

                var size = 3 + Math.random() * 4;
                orb.style.width = size + 'px';
                orb.style.height = size + 'px';

                var w = coverContainer.offsetWidth;
                var h = coverContainer.offsetHeight;

                var side = Math.floor(Math.random() * 4);
                var x, y;
                var offset = 4;

                if (side === 0) {
                    x = Math.random() * w;
                    y = -offset;
                } else if (side === 1) {
                    x = w + offset;
                    y = Math.random() * h;
                } else if (side === 2) {
                    x = Math.random() * w;
                    y = h + offset;
                } else {
                    x = -offset;
                    y = Math.random() * h;
                }

                orb.style.left = x + 'px';
                orb.style.top = y + 'px';

                orbsContainer.appendChild(orb);

                var centerX = w / 2;
                var centerY = h / 2;
                var dirX = x - centerX;
                var dirY = y - centerY;
                var len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
                dirX /= len;
                dirY /= len;

                var distance = 90 + Math.random() * 90;
                var dx = dirX * distance;
                var dy = dirY * distance;

                var duration = 4000 + Math.random() * 2000;

                var anim = orb.animate([
                    { transform: 'translate(-50%, -50%) scale(0.4)', opacity: 0 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.8, offset: 0.2 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.6, offset: 0.6 },
                    { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.6)', opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'forwards'
                });

                anim.onfinish = function() {
                    if (orb.parentNode) orb.parentNode.removeChild(orb);
                };
            }

            function startOrbs() {
                if (orbInterval) return;
                orbInterval = setInterval(function() {
                    createOrb();
                    if (Math.random() < 0.3) createOrb();
                }, 350);
            }

            function stopOrbs() {
                if (orbInterval) {
                    clearInterval(orbInterval);
                    orbInterval = null;
                }
            }

            cover.addEventListener('click', function() {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            audio.addEventListener('play', function() {
                isPlaying = true;
                cover.classList.add('playing');
                trackTitle.classList.add('playing');
                trackArtist.classList.add('playing');
                startOrbs();
            });

            audio.addEventListener('pause', function() {
                isPlaying = false;
                cover.classList.remove('playing');
                trackTitle.classList.remove('playing');
                trackArtist.classList.remove('playing');
                stopOrbs();
            });

            audio.addEventListener('ended', function() {
                isPlaying = false;
                cover.classList.remove('playing');
                trackTitle.classList.remove('playing');
                trackArtist.classList.remove('playing');
                stopOrbs();
            });

            audio.volume = 1;

            volumeSlider.addEventListener('input', function() {
                var val = parseFloat(this.value);
                audio.volume = Math.min(val, 1);

                if (val === 0) volumeLabel.textContent = '🔇';
                else if (val < 0.5) volumeLabel.textContent = '🔉';
                else volumeLabel.textContent = '🔊';
            });

            // ============================================
            // ЛАЙКИ ЧЕРЕЗ FIREBASE
            // ============================================
            var firebaseConfig = {
                apiKey: "AIzaSyAiI8dX8gv2UiZet1tVXEPY7AygW-ng_-4",
                authDomain: "g771-719cf.firebaseapp.com",
                databaseURL: "https://g771-719cf-default-rtdb.firebaseio.com",
                projectId: "g771-719cf",
                storageBucket: "g771-719cf.firebasestorage.app",
                messagingSenderId: "313498881889",
                appId: "1:313498881889:web:350e1da69c74b3117eff20",
                measurementId: "G-TW9J86MXG5"
            };

            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
            var likesRef = db.ref('likes');

            var starBtn = document.getElementById('star-btn');
            var likeCountEl = document.getElementById('like-count');
            var hasLiked = localStorage.getItem('hasLiked') === 'true';

            likesRef.on('value', function(snapshot) {
                var val = snapshot.val() || 0;
                likeCountEl.textContent = val;
            });

            if (hasLiked) {
                starBtn.classList.add('liked');
                likeCountEl.classList.add('liked');
            }

            starBtn.addEventListener('click', function() {
                if (hasLiked) {
                    hasLiked = false;
                    localStorage.removeItem('hasLiked');
                    starBtn.classList.remove('liked');
                    likeCountEl.classList.remove('liked');
                    likesRef.transaction(function(current) {
                        return Math.max(0, (current || 0) - 1);
                    });
                } else {
                    hasLiked = true;
                    localStorage.setItem('hasLiked', 'true');
                    starBtn.classList.add('liked');
                    likeCountEl.classList.add('liked');
                    likesRef.transaction(function(current) {
                        return (current || 0) + 1;
                    });
                }
            });
        })();
    </script>
