<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>text</title>
    <style>
        body {
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
            background: #111;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -60px;
            background-image: url('https://i.imgur.com/kBpBHJG.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(40px) saturate(1.2) brightness(0.7);
            transform: scale(1.1);
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                rgba(17, 17, 17, 0.35) 0%,
                rgba(17, 17, 17, 0.6) 70%,
                rgba(17, 17, 17, 0.8) 100%
            );
            z-index: -1;
            pointer-events: none;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-top: 60px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* ==== ОБЁРТКА КНОПКИ ==== */
        .btn-wrap {
            position: relative;
            display: inline-block;
            padding: 4px; /* запас, чтобы орбы не обрезались */
        }

        /* Контейнер орбов — точно по размеру кнопки */
        .btn-orbs {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .btn-orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* ==== КНОПКА TELEGRAM ==== */
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transform-origin: center center;
            position: relative;
            z-index: 2;
            transition: background-color 0.3s ease, transform 0.4s ease, box-shadow 0.4s ease;
            box-shadow:
                0 0 8px rgba(0, 153, 230, 0.6),
                0 0 16px rgba(0, 153, 230, 0.4),
                0 0 32px rgba(0, 153, 230, 0.25),
                0 0 56px rgba(0, 153, 230, 0.12);
        }

        .btn-wrap:hover .telegram-btn {
            background-color: #0099e6;
            transform: scale(1.08);
            box-shadow:
                0 0 12px rgba(0, 153, 230, 0.9),
                0 0 24px rgba(0, 153, 230, 0.7),
                0 0 48px rgba(0, 153, 230, 0.5),
                0 0 80px rgba(0, 153, 230, 0.3);
        }

        .telegram-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ==== КНОПКА STEAM ==== */
        .steam-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background-color: #1b2838;
            color: #c7d5e0;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transform-origin: center center;
            position: relative;
            z-index: 2;
            transition: background-color 0.3s ease, transform 0.4s ease, box-shadow 0.4s ease, color 0.3s ease;
            box-shadow:
                0 0 8px rgba(27, 40, 56, 0.95),
                0 0 16px rgba(27, 40, 56, 0.75),
                0 0 32px rgba(27, 40, 56, 0.5),
                0 0 56px rgba(27, 40, 56, 0.25);
        }

        .btn-wrap:hover .steam-btn {
            background-color: #2a475e;
            color: #ffffff;
            transform: scale(1.08);
            box-shadow:
                0 0 12px rgba(42, 71, 94, 1),
                0 0 24px rgba(42, 71, 94, 0.8),
                0 0 48px rgba(42, 71, 94, 0.55),
                0 0 80px rgba(42, 71, 94, 0.3);
        }

        .steam-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .main-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .cover-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            transition: transform 0.4s ease;
            transform-origin: center center;
        }

        .cover-container:hover {
            transform: scale(1.03);
        }

        .cover {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            z-index: 2;
            transition: box-shadow 0.4s ease;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .orbs {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: rgba(232, 164, 234, 0.45);
            box-shadow:
                0 0 8px 2px rgba(232, 164, 234, 0.6),
                0 0 20px 6px rgba(232, 164, 234, 0.35),
                0 0 40px 12px rgba(232, 164, 234, 0.15);
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        #sc-widget {
            display: none;
        }

        .track-title {
            margin-top: 30px;
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            opacity: 0.9;
            text-shadow:
                0 0 3px rgba(255, 255, 255, 0.8),
                0 0 6px rgba(255, 255, 255, 0.6),
                0 0 12px rgba(255, 255, 255, 0.4);
            transition: text-shadow 0.6s ease, transform 0.4s ease, opacity 0.6s ease;
            transform-origin: center center;
        }

        .track-title.playing {
            opacity: 1;
            text-shadow:
                0 0 4px #ffffff,
                0 0 8px #ffffff,
                0 0 16px #ffffff,
                0 0 28px rgba(232, 164, 234, 0.8),
                0 0 50px rgba(232, 164, 234, 0.5),
                0 0 80px rgba(232, 164, 234, 0.25);
        }

        .track-artist {
            margin-top: 10px;
            font-size: 12px;
            color: #ffffff;
            opacity: 0.55;
            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.5);
            transition: text-shadow 0.6s ease, transform 0.4s ease, opacity 0.6s ease;
            transform-origin: center center;
        }

        .track-artist.playing {
            opacity: 0.8;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.8),
                0 0 12px rgba(232, 164, 234, 0.55),
                0 0 24px rgba(232, 164, 234, 0.3);
        }

        .main-block.hovered .track-title,
        .main-block.hovered .track-artist {
            transform: scale(1.08);
        }

        .volume-wrapper {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(232, 164, 234, 0.08);
            transform-origin: top right;
            opacity: 0.35;
            transition: opacity 0.4s ease, box-shadow 0.5s ease, transform 0.4s ease, border-color 0.4s ease;
            z-index: 100;
            box-shadow:
                0 0 8px rgba(232, 164, 234, 0.25),
                0 0 16px rgba(232, 164, 234, 0.15);
        }

        .volume-wrapper:hover {
            opacity: 1;
            transform: scale(1.08);
            border-color: rgba(232, 164, 234, 0.3);
            box-shadow:
                0 0 12px rgba(232, 164, 234, 0.9),
                0 0 24px rgba(232, 164, 234, 0.6),
                0 0 48px rgba(232, 164, 234, 0.4),
                0 0 80px rgba(232, 164, 234, 0.2);
        }

        #volume-slider {
            width: 70px;
            height: 3px;
            cursor: pointer;
            accent-color: #e8a4ea;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        #volume-slider::-webkit-slider-runnable-track {
            height: 3px;
            background: rgba(232, 164, 234, 0.3);
            border-radius: 3px;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e8a4ea;
            margin-top: -3.5px;
            box-shadow: 0 0 6px rgba(232, 164, 234, 0.8);
        }

        #volume-slider::-moz-range-track {
            height: 3px;
            background: rgba(232, 164, 234, 0.3);
            border-radius: 3px;
        }

        #volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            background: #e8a4ea;
            box-shadow: 0 0 6px rgba(232, 164, 234, 0.8);
        }

        #volume-label {
            font-size: 11px;
            user-select: none;
            color: #e8a4ea;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <div class="btn-wrap" data-orb-color="0, 153, 230" data-orb-core="0, 200, 255">
            <div class="btn-orbs"></div>
            <a href="https://t.me/reducethejaw" target="_blank" class="telegram-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
                Telegram
            </a>
        </div>

        <div class="btn-wrap" data-orb-color="42, 71, 94" data-orb-core="95, 140, 180">
            <div class="btn-orbs"></div>
            <a href="https://steamcommunity.com/profiles/76561199831931325/" target="_blank" class="steam-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.979 0C5.511 0 .203 5.053 0 11.47l6.442 2.664a3.38 3.38 0 0 1 1.884-.574c.067 0 .133.005.199.008l2.865-4.146v-.058c0-2.28 1.863-4.142 4.143-4.142 2.28 0 4.143 1.862 4.143 4.142 0 2.28-1.863 4.143-4.143 4.143h-.096l-4.086 2.913c0 .054.005.109.005.163a3.389 3.389 0 0 1-3.389 3.386 3.393 3.393 0 0 1-3.345-2.81L.146 16.202C1.376 20.75 5.493 24 10.332 24c5.866 0 10.668-4.742 10.668-10.585C21 5.15 16.158.001 11.979.001zm-4.13 18.281c.354.797 1.156 1.354 2.087 1.354a2.294 2.294 0 0 0 2.293-2.29c0-.195-.025-.39-.075-.577l2.43-1.732c.295.135.624.211.97.211a2.295 2.295 0 0 0 2.294-2.29 2.295 2.295 0 0 0-2.294-2.29 2.295 2.295 0 0 0-2.294 2.29c0 .164.018.325.05.481l-2.49 1.775a2.283 2.283 0 0 0-1.178-.324 2.294 2.294 0 0 0-2.294 2.29c0 .062.003.124.008.185L4.31 16.32a1.484 1.484 0 0 1 2.55 1.47l1.017.492zm10.995-11.32a3.053 3.053 0 1 0 0 6.107 3.053 3.053 0 0 0 0-6.107zm0 .78a2.273 2.273 0 1 1 0 4.546 2.273 2.273 0 0 1 0-4.546zm-6.705 7.638a1.529 1.529 0 0 1-1.531 1.528 1.529 1.529 0 0 1-1.531-1.528 1.529 1.529 0 0 1 1.531-1.527 1.529 1.529 0 0 1 1.531 1.527z"/>
                </svg>
                Steam
            </a>
        </div>
    </div>

    <div class="main-block" id="mainBlock">
        <div class="cover-container" id="coverContainer">
            <div class="cover" id="cover">
                <img src="https://i.imgur.com/kBpBHJG.jpeg" alt="Cover">
            </div>
            <div class="orbs" id="orbs"></div>
        </div>

        <div class="track-title" id="trackTitle">Больше не будет</div>
        <div class="track-artist" id="trackArtist">nozomi file</div>
    </div>

    <div class="volume-wrapper">
        <span id="volume-label">🔊</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
    </div>

    <iframe id="sc-widget" width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" 
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2113010553&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false&sharing=false">
    </iframe>

    <script src="https://w.soundcloud.com/player/api.js" type="text/javascript"></script>
    <script>
        (function() {
            var widgetIframe = document.getElementById('sc-widget');
            var widget = SC.Widget(widgetIframe);
            var cover = document.getElementById('cover');
            var coverContainer = document.getElementById('coverContainer');
            var mainBlock = document.getElementById('mainBlock');
            var orbsContainer = document.getElementById('orbs');
            var volumeSlider = document.getElementById('volume-slider');
            var volumeLabel = document.getElementById('volume-label');
            var trackTitle = document.getElementById('trackTitle');
            var trackArtist = document.getElementById('trackArtist');
            var isPlaying = false;
            var orbInterval = null;

            // ==== ОРБЫ У КНОПОК ====
            function setupButtonOrbs() {
                var wraps = document.querySelectorAll('.btn-wrap');
                wraps.forEach(function(wrap) {
                    var orbsBox = wrap.querySelector('.btn-orbs');
                    var btn = wrap.querySelector('a');
                    var color = wrap.getAttribute('data-orb-color');
                    var coreColor = wrap.getAttribute('data-orb-core') || color;
                    var interval = null;

                    wrap.addEventListener('mouseenter', function() {
                        if (interval) return;
                        interval = setInterval(function() {
                            createButtonOrb(orbsBox, btn, color, coreColor);
                        }, 250);
                        createButtonOrb(orbsBox, btn, color, coreColor);
                        createButtonOrb(orbsBox, btn, color, coreColor);
                    });

                    wrap.addEventListener('mouseleave', function() {
                        if (interval) {
                            clearInterval(interval);
                            interval = null;
                        }
                    });
                });
            }

            function createButtonOrb(container, btn, color, coreColor) {
                var orb = document.createElement('div');
                orb.className = 'btn-orb';

                var size = 2 + Math.random() * 3;
                orb.style.width = size + 'px';
                orb.style.height = size + 'px';

                orb.style.background = 'radial-gradient(circle, rgba(' + coreColor + ', 0.95) 0%, rgba(' + color + ', 0.6) 60%, rgba(' + color + ', 0) 100%)';
                orb.style.boxShadow =
                    '0 0 5px 1px rgba(' + coreColor + ', 0.8),' +
                    '0 0 12px 3px rgba(' + color + ', 0.5),' +
                    '0 0 22px 6px rgba(' + color + ', 0.2)';

                var w = btn.offsetWidth;
                var h = btn.offsetHeight;

                // Спавн СНАРУЖИ кнопки — за её краем
                var side = Math.floor(Math.random() * 4);
                var x, y;
                var outside = 2; // на сколько пикселей наружу

                if (side === 0) {
                    x = Math.random() * w;
                    y = -outside;
                } else if (side === 1) {
                    x = w + outside;
                    y = Math.random() * h;
                } else if (side === 2) {
                    x = Math.random() * w;
                    y = h + outside;
                } else {
                    x = -outside;
                    y = Math.random() * h;
                }

                orb.style.left = x + 'px';
                orb.style.top = y + 'px';

                container.appendChild(orb);

                var centerX = w / 2;
                var centerY = h / 2;
                var dirX = x - centerX;
                var dirY = y - centerY;
                var len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
                dirX /= len;
                dirY /= len;

                // Разлёт наружу от кнопки
                var distance = 8 + Math.random() * 10;
                var dx = dirX * distance;
                var dy = dirY * distance;

                var duration = 3000 + Math.random() * 1500;

                var anim = orb.animate([
                    { transform: 'translate(-50%, -50%) scale(0.3)', opacity: 0 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.95, offset: 0.2 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.7, offset: 0.6 },
                    { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.5)', opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'forwards'
                });

                anim.onfinish = function() {
                    if (orb.parentNode) orb.parentNode.removeChild(orb);
                };
            }

            setupButtonOrbs();

            // ==== НАВЕДЕНИЕ НА ОБЛОЖКУ ====
            coverContainer.addEventListener('mouseenter', function() {
                mainBlock.classList.add('hovered');
            });
            coverContainer.addEventListener('mouseleave', function() {
                mainBlock.classList.remove('hovered');
            });

            // ==== ОРБЫ ОБЛОЖКИ ====
            function createOrb() {
                if (!isPlaying) return;
                var orb = document.createElement('div');
                orb.className = 'orb';

                var size = 3 + Math.random() * 4;
                orb.style.width = size + 'px';
                orb.style.height = size + 'px';

                var w = coverContainer.offsetWidth;
                var h = coverContainer.offsetHeight;

                var side = Math.floor(Math.random() * 4);
                var x, y;
                var offset = 4;

                if (side === 0) {
                    x = Math.random() * w;
                    y = -offset;
                } else if (side === 1) {
                    x = w + offset;
                    y = Math.random() * h;
                } else if (side === 2) {
                    x = Math.random() * w;
                    y = h + offset;
                } else {
                    x = -offset;
                    y = Math.random() * h;
                }

                orb.style.left = x + 'px';
                orb.style.top = y + 'px';

                orbsContainer.appendChild(orb);

                var centerX = w / 2;
                var centerY = h / 2;
                var dirX = x - centerX;
                var dirY = y - centerY;
                var len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
                dirX /= len;
                dirY /= len;

                var distance = 90 + Math.random() * 90;
                var dx = dirX * distance;
                var dy = dirY * distance;

                var duration = 4000 + Math.random() * 2000;

                var anim = orb.animate([
                    { transform: 'translate(-50%, -50%) scale(0.4)', opacity: 0 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.8, offset: 0.2 },
                    { transform: 'translate(-50%, -50%) scale(1)',   opacity: 0.6, offset: 0.6 },
                    { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.6)', opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'forwards'
                });

                anim.onfinish = function() {
                    if (orb.parentNode) orb.parentNode.removeChild(orb);
                };
            }

            function startOrbs() {
                if (orbInterval) return;
                orbInterval = setInterval(function() {
                    createOrb();
                    if (Math.random() < 0.3) createOrb();
                }, 350);
            }

            function stopOrbs() {
                if (orbInterval) {
                    clearInterval(orbInterval);
                    orbInterval = null;
                }
            }

            // ==== SOUNDCLOUD ====
            widget.bind(SC.Widget.Events.READY, function() {
                console.log('Плеер готов!');
                widget.setVolume(1);

                cover.addEventListener('click', function() {
                    if (isPlaying) {
                        widget.pause();
                    } else {
                        widget.play();
                    }
                });

                var updateVolume = function() {
                    var val = parseFloat(volumeSlider.value);
                    widget.setVolume(val);
                    
                    if (val === 0) volumeLabel.textContent = '🔇';
                    else if (val < 0.5) volumeLabel.textContent = '🔉';
                    else volumeLabel.textContent = '🔊';
                };

                volumeSlider.addEventListener('input', updateVolume);
                volumeSlider.addEventListener('change', updateVolume);

                widget.bind(SC.Widget.Events.PLAY, function() {
                    isPlaying = true;
                    cover.style.boxShadow = '0 4px 30px rgba(232, 164, 234, 0.7), 0 0 60px rgba(232, 164, 234, 0.4)';
                    trackTitle.classList.add('playing');
                    trackArtist.classList.add('playing');
                    startOrbs();
                });

                widget.bind(SC.Widget.Events.PAUSE, function() {
                    isPlaying = false;
                    cover.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.5)';
                    trackTitle.classList.remove('playing');
                    trackArtist.classList.remove('playing');
                    stopOrbs();
                });

                widget.bind(SC.Widget.Events.FINISH, function() {
                    isPlaying = false;
                    cover.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.5)';
                    trackTitle.classList.remove('playing');
                    trackArtist.classList.remove('playing');
                    stopOrbs();
                });
            });
        })();
    </script>
</body>
</html>
